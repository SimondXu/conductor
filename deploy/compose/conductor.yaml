# Conductor config for the compose stack. The DSN comes from the environment.
version: v1alpha
server:
  address: 0.0.0.0:8494
eventlog:
  postgres:
    dsn: ${CONDUCTOR_DSN}
    # Short, so a killed controller's runs are recovered quickly (smoke.sh).
    lease_ttl: 5s
registry:
  # The Go-only image has no Python, so the antigravity sidecar is off.
  antigravity:
    disabled: true
  fake:
    default: true
    endpoint: fake-harness:50053

# Local Conductor stack, zero API keys:
#   docker compose -f deploy/compose/docker-compose.yml up --build
# Host ports default to 5432, 50053, 8494-8496, 9090, 3000 and 16686; override
# any of them with POSTGRES_PORT, FAKE_HARNESS_PORT, CONDUCTOR_PORT,
# CONDUCTOR_2_PORT, CONDUCTOR_3_PORT, PROMETHEUS_PORT, GRAFANA_PORT or
# JAEGER_PORT. Then
#   docker compose -f deploy/compose/docker-compose.yml exec conductor \
#     conductor run --server localhost:8494 --input "book me a flight"

x-conductor-image: &conductor-image
  build:
    context: ../..
    dockerfile: cmd/conductor/Dockerfile
    target: conductor

x-dsn: &dsn
  CONDUCTOR_DSN: postgres://conductor:conductor@postgres:5432/conductor?sslmode=disable
  # Clients and harnesses export spans here; serve reads conductor.yaml.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

# Three controller replicas share the database (PRD M7) and take over runs
# whose owner dies. Each publishes a host port for `conductor chaos`.
x-conductor-replica: &conductor-replica
  <<: *conductor-image
  environment: *dsn
  working_dir: /etc/conductor
  volumes:
    - ./conductor.yaml:/etc/conductor/conductor.yaml:ro
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:9090/metrics"]
    interval: 2s
    retries: 30

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "conductor"]
      interval: 2s
      retries: 30

  fake-harness:
    <<: *conductor-image
    environment: *dsn
    command: ["sh", "-c", "exec conductor harness fake --host 0.0.0.0 --port 50053 --effects-dsn \"$$CONDUCTOR_DSN\" --metrics-addr :9091"]
    # crash_after_effect exits the process; come back for the resume.
    restart: on-failure
    ports: ["${FAKE_HARNESS_PORT:-50053}:50053"]
    depends_on:
      postgres: {condition: service_healthy}
      jaeger: {condition: service_started}

  conductor:
    <<: *conductor-replica
    # `conductor chaos` arms the crash points here (ARCHITECTURE.md §8.1).
    environment:
      <<: *dsn
      CONDUCTOR_CHAOS_KILL_AT: ${CONDUCTOR_CHAOS_KILL_AT:-}
    # A short drain, so smoke.sh can watch a SIGTERM hand a run over.
    command: ["sh", "-c", "conductor migrate up && exec conductor serve --drain-timeout 2s"]
    ports: ["${CONDUCTOR_PORT:-8494}:8494"]
    depends_on:
      postgres: {condition: service_healthy}
      fake-harness: {condition: service_started}
      jaeger: {condition: service_started}

  conductor-2:
    <<: *conductor-replica
    command: ["conductor", "serve", "--drain-timeout", "2s"]
    ports: ["${CONDUCTOR_2_PORT:-8495}:8494"]
    depends_on:
      conductor: {condition: service_healthy}

  conductor-3:
    <<: *conductor-replica
    command: ["conductor", "serve", "--drain-timeout", "2s"]
    ports: ["${CONDUCTOR_3_PORT:-8496}:8494"]
    depends_on:
      conductor: {condition: service_healthy}

  # Traces (ARCHITECTURE.md §7.1): OTLP in, UI on :16686.
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports: ["${JAEGER_PORT:-16686}:16686"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [conductor]

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

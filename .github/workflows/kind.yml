# M6 on plain Kubernetes, with no Agent Substrate: delete a harness pod
# mid-tool-call and require the run to recover and complete.
name: Kind

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pod-executor:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v4
      with:
        go-version-file: go.mod

    - name: Install kind
      run: go install sigs.k8s.io/kind@v0.33.0

    - name: Delete the executor pod, expect recovery
      run: PATH="$(go env GOPATH)/bin:$PATH" ./deploy/k8s/kind-e2e.sh

    - name: State on failure
      if: failure()
      run: |
        kubectl --context kind-conductor-e2e -n conductor get pods -o wide
        kubectl --context kind-conductor-e2e -n conductor logs deploy/conductor --tail 200

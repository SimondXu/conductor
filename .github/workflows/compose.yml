# The local stack, end to end with zero API keys: the same script a developer
# runs, so the README path cannot rot.
name: Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Compose smoke test
      run: ./deploy/compose/smoke.sh

    - name: Logs on failure
      if: failure()
      run: docker compose -f deploy/compose/docker-compose.yml logs

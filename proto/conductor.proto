// Conductor's own API, beside the inherited InteractionsService in ax.proto,
// which follows the pinned upstream protocol and is not extended here.

syntax = "proto3";

package ax;

import "proto/ax.proto";

option go_package = "github.com/simondxu/conductor/proto";

// AttachRequest re-attaches a client to a conversation (PRD.md §6.1,
// client-stream catch-up replay).
message AttachRequest {
  string conversation_id = 1;
  // The last log step the client has; 0 for the whole conversation. Every
  // step a client receives carries its log step in Step.index.
  int64 after_step = 2;
}

service ConductorService {
  // Attach streams the conversation's logged steps after after_step, then
  // each new one as it is logged, and ends once the run is in a terminal
  // state. It only reads the log, so any replica serves it, wherever the
  // run executes. A PENDING run that nobody is driving is resumed.
  rpc Attach(AttachRequest) returns (stream CreateInteractionResponse);
}
